name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by the Sync AIPs workflow on its PR branch: pull requests opened
  # with GITHUB_TOKEN don't trigger pull_request runs, but workflow_dispatch
  # does. Such runs report a commit status, which the PR's checks list shows.
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  # Pinned so a new linter rule or CLI release can't turn main red on its own.
  API_LINTER_VERSION: v2.4.0
  CLAUDE_CODE_VERSION: 2.1.285

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_URL: repos/${{ github.repository }}/statuses/${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report pending status (dispatched runs)
        if: github.event_name == 'workflow_dispatch'
        run: gh api "$STATUS_URL" -f state=pending -f context="CI / check" -f target_url="$RUN_URL" -f description="Running" > /dev/null

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false # no go.sum; api-linter is installed with go install

      - name: Install api-linter
        run: |
          go install "github.com/googleapis/api-linter/v2/cmd/api-linter@${API_LINTER_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Unit and lint-wrapper tests
        run: python -m unittest discover -s tests -v

      - name: Bundled AIPs match the pinned upstream commit
        run: python tools/sync_aips.py --check

      - name: The skill folder carries its license and notice
        run: |
          cmp LICENSE plugins/aip/skills/aip/LICENSE
          cmp NOTICE plugins/aip/skills/aip/NOTICE

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate marketplace and plugin
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude plugin validate . --strict
          claude plugin validate ./plugins/aip --strict

      - name: Report final status (dispatched runs)
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          state=$([ "${{ job.status }}" = success ] && echo success || echo failure)
          gh api "$STATUS_URL" -f state="$state" -f context="CI / check" -f target_url="$RUN_URL" -f description="${{ job.status }}" > /dev/null
