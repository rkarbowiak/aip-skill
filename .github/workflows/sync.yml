name: Sync AIPs

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # to start CI on the PR branch

defaults:
  run:
    shell: bash # runs with -eo pipefail

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Sync from upstream HEAD
        id: sync
        run: |
          python tools/sync_aips.py --update 2>&1 | tee sync.log
          echo "commit=$(cut -c1-12 UPSTREAM)" >> "$GITHUB_OUTPUT"

      # Fail before opening a PR if the new upstream text breaks the sync.
      - name: Check the result
        run: |
          python -m unittest discover -s tests -v
          python tools/sync_aips.py --check

      # Needs "Allow GitHub Actions to create and approve pull requests" in
      # the repository's Actions settings.
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: pr
        with:
          branch: sync/aips
          commit-message: "Sync AIPs to aip-dev/google.aip.dev@${{ steps.sync.outputs.commit }}"
          title: "Sync AIPs to upstream ${{ steps.sync.outputs.commit }}"
          body: |
            Automated sync of the bundled AIPs from aip-dev/google.aip.dev.
            Review the diff for new or changed guidance that SKILL.md's quick
            reference should reflect.
          add-paths: |
            UPSTREAM
            plugins/aip/skills/aip

      # A PR opened with GITHUB_TOKEN doesn't start the pull_request CI run,
      # but a workflow_dispatch does, and its checks show on the PR.
      - name: Run CI on the PR branch
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref sync/aips
